name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generated and formatted files
        run: |
          test -z "$(gofmt -l .)"
          make manifests
      - name: Test
        run: make test
      - name: Vet
        run: make vet
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
      - name: Build
        run: make build

  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/kubeovn/kube-ovn-operator:${{ github.sha }}
