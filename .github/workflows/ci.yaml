name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generated and formatted files
        run: |
          test -z "$(gofmt -l .)"
          make manifests
          make chart-lint
      - name: Render pinned upstream chart
        run: |
          curl --fail --location --silent --show-error https://github.com/kubeovn/kube-ovn/releases/download/v1.16.13/kube-ovn-v1.16.13.tgz --output /tmp/kube-ovn-v1.16.13.tgz
          KUBE_OVN_CHART_ARCHIVE=/tmp/kube-ovn-v1.16.13.tgz go test ./internal/chart -run TestReleasedKubeOVNChart -count=1
      - name: Test
        run: make test
      - name: Verify live OVSDB and OVN runtime health
        env:
          OVSDB_TEST_BIN: /tmp/operator-ovsdb/bin
          OVN_TEST_BIN: /tmp/operator-ovsdb/bin
          OVN_TEST_SCHEMA_DIR: /tmp/operator-ovsdb/root/usr/share/ovn
          OVS_TEST_SCHEMA: /tmp/operator-ovsdb/root/usr/share/openvswitch/vswitch.ovsschema
          LD_LIBRARY_PATH: /tmp/operator-ovsdb/root/usr/lib/x86_64-linux-gnu:/tmp/operator-ovsdb/root/lib/x86_64-linux-gnu
          TMPDIR: /tmp
        run: |
          sudo apt-get update -qq
          mkdir -p /tmp/operator-ovsdb/bin
          (
            cd /tmp/operator-ovsdb
            apt-get download openvswitch-common openvswitch-switch ovn-common ovn-central ovn-host libunbound8 libcap-ng0 libatomic1 libevent-2.1-7t64 libbpf1 libxdp1 libnuma1 libunwind8
            for package in ./*.deb; do dpkg-deb --extract "$package" root; done
            for name in ovsdb-client ovsdb-tool ovs-vsctl ovs-appctl ovn-appctl ovn-controller ovn-northd; do
              ln -s "/tmp/operator-ovsdb/root/usr/bin/$name" "bin/$name"
            done
            ln -s /tmp/operator-ovsdb/root/usr/sbin/ovsdb-server bin/ovsdb-server
            for location in usr/sbin usr/lib/openvswitch-switch; do
              if test -x "root/$location/ovs-vswitchd"; then
                ln -s "/tmp/operator-ovsdb/root/$location/ovs-vswitchd" bin/ovs-vswitchd
                break
              fi
            done
          )
          "$OVSDB_TEST_BIN/ovsdb-server" --version
          "$OVN_TEST_BIN/ovn-northd" --version
          go test ./internal/health -run 'TestLive(OVSDB|OVN)' -count=1 -v
          go test ./internal/prepare ./cmd/member-prepare ./internal/central ./cmd/member-run -run 'TestLiveOVN' -count=1 -v
      - name: Race-check operation coordination
        run: go test -race ./internal/lease ./internal/apply ./internal/controller ./internal/ovnadmin ./internal/health ./internal/probe ./internal/backup ./internal/approval ./internal/prepare ./internal/central ./internal/workload
      - name: Vet
        run: make vet
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
      - name: Build
        run: make build

  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/kubeovn/kube-ovn-operator:${{ github.sha }}

  central-runtime:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: central-test
          load: true
          push: false
          tags: kube-ovn-central-test:${{ github.sha }}
      - name: Verify helpers and native lifecycle in the pinned runtime image
        env:
          TEST_IMAGE: kube-ovn-central-test:${{ github.sha }}
        run: |
          docker run --rm --init --entrypoint /member-prepare "$TEST_IMAGE" --help
          docker run --rm --init --entrypoint /member-run "$TEST_IMAGE" --help
          docker run --rm --init --read-only --tmpfs /tmp:rw,mode=1777 "$TEST_IMAGE"
