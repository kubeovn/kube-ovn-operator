name: E2E

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
      - 'charts/**'
      - 'Dockerfile'
      - 'Makefile'
      - 'test/**'
      - '.github/workflows/e2e.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install kind
        run: |
          curl --fail --location --silent --show-error \
            https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64 \
            --output /tmp/kind
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
      - name: Create kind cluster
        run: kind create cluster --name kube-ovn-operator-e2e --wait 120s
      - name: Run operator smoke test
        run: make e2e
      - name: Run render, apply and observe integration
        run: bash test/e2e/runtime-smoke.sh
      - name: Verify live operation Lease coordination
        run: go run ./test/e2e/lease-smoke
      - name: Verify member removal approval admission and audit
        run: go run ./test/e2e/approval-smoke
      - name: Verify pod-network probe traffic and backend identity
        run: |
          bash test/e2e/probe-image.sh kube-ovn-operator-e2e
          go run ./test/e2e/network-smoke
      - name: Verify durable joint NB/SB replacement and workload retirement
        run: bash test/e2e/member-image.sh kube-ovn-operator-e2e
      - name: Diagnose member provisioning failure
        if: failure()
        run: |
          kubectl get jobs,pods,statefulsets,pvc -n kube-ovn-operator-system -o wide
          kubectl get events -n kube-ovn-operator-system --sort-by=.metadata.creationTimestamp
          kubectl logs -n kube-ovn-operator-system member-seed-0 --all-containers --tail=100 || true
          kubectl logs -n kube-ovn-operator-system -l app=ovn-central --all-containers --tail=100 || true

  controller-deployment-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install kind
        run: |
          curl --fail --location --silent --show-error \
            https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64 \
            --output /tmp/kind
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
      - name: Create kind cluster
        run: kind create cluster --name kube-ovn-operator-controller-e2e --config test/e2e/kind-controller.yaml --wait 120s
      - name: Verify default Controller Deployment handoff admission
        run: bash test/e2e/controller-handoff-smoke.sh
      - name: Diagnose default Controller handoff failure
        if: failure()
        run: |
          kubectl get kubeovninstallations,deployments,replicasets,pods,pvc,pv,configmaps -A -o wide || true
          kubectl get koi/controller-retirement -n kube-ovn-operator-system -o yaml || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp || true
          kubectl logs -n kube-ovn-operator-system -l app=ovn-central --all-containers --prefix --tail=100 || true
