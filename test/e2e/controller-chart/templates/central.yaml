apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovn-central
  namespace: {{ .Values.namespace }}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ovn-central
  template:
    metadata:
      labels:
        app: ovn-central
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ .Release.Name }}-central
      initContainers:
        - name: prepare-ovn-storage
          image: kube-ovn-central-fixture:e2e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - mkdir -p /etc/ovn /var/run/ovn && chmod 0700 /etc/ovn /var/run/ovn && chown -R 65532:65532 /etc/ovn /var/run/ovn
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: ovn-data
              mountPath: /etc/ovn
            - name: ovn-run
              mountPath: /var/run/ovn
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ovn-central
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ovn-central
          image: kube-ovn-central-fixture:e2e
          imagePullPolicy: IfNotPresent
          command: ["/fixture/start.sh"]
          env:
            - name: NODE_IPS
              value: {{ .Values.MASTER_NODES | quote }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
          readinessProbe:
            exec:
              command: ["/fixture/ready.sh"]
            periodSeconds: 1
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: ovn-data
              mountPath: /etc/ovn
            - name: ovn-run
              mountPath: /var/run/ovn
      volumes:
        - name: ovn-data
          hostPath:
            path: /tmp/kube-ovn-operator-controller-fixture
            type: DirectoryOrCreate
        - name: ovn-run
          emptyDir: {}
