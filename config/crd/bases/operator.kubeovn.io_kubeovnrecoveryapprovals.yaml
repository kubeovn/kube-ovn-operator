apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubeovnrecoveryapprovals.operator.kubeovn.io
spec:
  group: operator.kubeovn.io
  scope: Namespaced
  names:
    plural: kubeovnrecoveryapprovals
    singular: kubeovnrecoveryapproval
    kind: KubeOVNRecoveryApproval
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Revoked, type: boolean, jsonPath: .spec.revoked}
        - {name: Expires, type: date, jsonPath: .spec.expiresAt}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: "!has(self.status) || self.status.phase != 'Completed' || (has(oldSelf.status) && oldSelf.status.phase in ['Reserved', 'Completed'])"
              message: Completion requires a previously recorded reservation.
            - rule: '!has(oldSelf.status) || !has(oldSelf.status.phase) || has(self.status)'
              message: A recorded reservation cannot be cleared.
            - rule: '!has(self.status) || self.status.reservedAt < self.spec.expiresAt'
              message: Reservation must precede approval expiry.
          properties:
            spec:
              type: object
              required: [installationRef, installationGeneration, mode, sourceVersion, targetVersion, backupRef, topologyDigest, chartDigest, reason, expiresAt]
              x-kubernetes-validations:
                - rule: self.installationRef == oldSelf.installationRef && self.installationGeneration == oldSelf.installationGeneration && self.mode == oldSelf.mode && self.sourceVersion == oldSelf.sourceVersion && self.targetVersion == oldSelf.targetVersion && self.backupRef == oldSelf.backupRef && self.topologyDigest == oldSelf.topologyDigest && self.chartDigest == oldSelf.chartDigest && self.reason == oldSelf.reason && self.expiresAt == oldSelf.expiresAt
                  message: The recovery approval decision is immutable.
                - rule: has(self.requestRef) == has(oldSelf.requestRef) && (!has(self.requestRef) || self.requestRef == oldSelf.requestRef)
                  message: The optional request binding is immutable.
                - rule: '!has(self.requestRef) || (self.requestRef.name != "" && self.requestRef.uid != "" && self.requestRef.generation > 0)'
                  message: requestRef must contain a name, UID and positive generation.
                - rule: '!oldSelf.revoked || self.revoked'
                  message: Revocation cannot be reversed.
              properties:
                installationRef:
                  description: "Name and UID of the installation this approval authorizes."
                  type: object
                  required: [name, uid]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253}
                    uid: {type: string, minLength: 1, maxLength: 128}
                installationGeneration:
                  type: integer
                  description: "Installation generation at which this decision was made."
                  format: int64
                  minimum: 1
                requestRef:
                  type: object
                  required: [name, uid, generation]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253}
                    uid: {type: string, minLength: 1, maxLength: 128}
                    generation: {type: integer, format: int64, minimum: 1}
                mode:
                  type: string
                  description: "Destructive recovery operation authorized by this approval."
                  enum: [rollback, reconvert, freshBootstrap]
                sourceVersion: {type: string, minLength: 1, maxLength: 128}
                targetVersion: {type: string, minLength: 1, maxLength: 128}
                backupRef:
                  type: string
                  description: "Digest of the verified NB/SB backup pair to restore."
                  maxLength: 71
                  pattern: '^sha256:[0-9a-f]{64}$'
                topologyDigest: {type: string, maxLength: 71, pattern: '^sha256:[0-9a-f]{64}$'}
                chartDigest: {type: string, maxLength: 71, pattern: '^sha256:[0-9a-f]{64}$'}
                reason: {type: string, minLength: 1, maxLength: 2048, pattern: '\S'}
                expiresAt: {type: string, format: date-time}
                revoked: {type: boolean, default: false}
            status:
              type: object
              required: [phase, decisionDigest, reservedAt]
              x-kubernetes-validations:
                - rule: "oldSelf.phase != 'Completed' || self == oldSelf"
                  message: Completed audit evidence is immutable.
                - rule: "self.phase == oldSelf.phase || (oldSelf.phase == 'Reserved' && self.phase == 'Completed')"
                  message: An approval can only progress from Reserved to Completed.
                - rule: self.decisionDigest == oldSelf.decisionDigest && self.reservedAt == oldSelf.reservedAt
                  message: The reservation identity and timestamp are immutable.
                - rule: "self.phase == 'Completed' ? has(self.completedAt) : !has(self.completedAt)"
                  message: Only completed approvals may have completion evidence.
                - rule: '!has(self.completedAt) || self.completedAt >= self.reservedAt'
                  message: Completion must follow reservation.
              properties:
                phase: {type: string, maxLength: 9, enum: [Reserved, Completed]}
                decisionDigest: {type: string, maxLength: 71, pattern: '^sha256:[0-9a-f]{64}$'}
                reservedAt: {type: string, format: date-time}
                completedAt: {type: string, format: date-time}
