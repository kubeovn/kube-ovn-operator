apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubeovnrecoveryrequests.operator.kubeovn.io
spec:
  group: operator.kubeovn.io
  scope: Namespaced
  names:
    plural: kubeovnrecoveryrequests
    singular: kubeovnrecoveryrequest
    kind: KubeOVNRecoveryRequest
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [installationRef, reason, mode, approvedBy, expiresAt]
              properties:
                installationRef: {type: string}
                reason: {type: string}
                mode: {type: string, enum: [rejoin, reconvert, freshBootstrap]}
                backupRef: {type: string}
                approvedBy: {type: string}
                expiresAt: {type: string, format: date-time}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
