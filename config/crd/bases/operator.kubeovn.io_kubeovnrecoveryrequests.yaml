apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubeovnrecoveryrequests.operator.kubeovn.io
spec:
  group: operator.kubeovn.io
  scope: Namespaced
  names:
    plural: kubeovnrecoveryrequests
    singular: kubeovnrecoveryrequest
    kind: KubeOVNRecoveryRequest
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: '!has(oldSelf.status) || (!has(oldSelf.status.plan) && !has(oldSelf.status.execution)) || self.spec.suspend == oldSelf.spec.suspend'
              message: Suspension cannot change after a recovery plan is recorded.
          properties:
            spec:
              type: object
              required: [installationName, reason, mode, requestedBy, expiresAt]
              properties:
                suspend: {type: boolean, default: false}
                installationName:
                  type: string
                  description: "Name of the KubeOVNInstallation in this namespace to recover."
                reason:
                  type: string
                  description: "Human-readable reason for the recovery request."
                mode:
                  type: string
                  description: "Recovery operation; rejoin restores a member, while reconvert and freshBootstrap rebuild from a verified backup."
                  enum: [rejoin, reconvert, freshBootstrap]
                targetMemberName:
                  type: string
                  description: "Name of the explicit central.memberRequests entry to rejoin."
                backupRef:
                  type: string
                  description: "Digest of the verified backup pair used by reconvert or freshBootstrap."
                approvalRef:
                  type: object
                  required: [name, uid]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253}
                    uid: {type: string, minLength: 1, maxLength: 128}
                requestedBy:
                  type: string
                  description: "Caller-supplied audit label identifying the requester; it does not grant recovery authority."
                expiresAt:
                  type: string
                  description: "Time after which this request cannot be admitted."
                  format: date-time
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, AwaitingExecution, Executing, Succeeded, Failed, Expired]
                plan:
                  type: object
                  required: [digest, installationUID, installationGeneration, requestGeneration, mode, expiresAt]
                  properties:
                    digest: {type: string}
                    installationUID: {type: string}
                    installationGeneration: {type: integer, format: int64}
                    requestGeneration: {type: integer, format: int64}
                    mode: {type: string, enum: [rejoin, reconvert, freshBootstrap]}
                    sourceVersion: {type: string}
                    targetVersion: {type: string}
                    chartDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                    targetMemberName:
                      type: string
                      description: "Name of the central.memberRequests entry bound into the admitted plan."
                    targetMemberDigest: {type: string}
                    topologyDigest: {type: string}
                    backupRef: {type: string}
                    databaseRefs: {type: object, additionalProperties: {type: string}}
                    approvalRef:
                      type: object
                      required: [name, uid]
                      properties:
                        name: {type: string, minLength: 1, maxLength: 253}
                        uid: {type: string, minLength: 1, maxLength: 128}
                    expiresAt: {type: string, format: date-time}
                execution:
                  type: object
                  properties:
                    phase: {type: string, enum: [Blocked, Quiescing, Restoring, Workloads, Verifying, Succeeded, Failed]}
                    startedAt: {type: string, format: date-time}
                    completedAt: {type: string, format: date-time}
                    rpoSeconds: {type: integer, format: int64}
                    rtoSeconds: {type: integer, format: int64}
                    reason: {type: string}
                    operation:
                      type: object
                      description: "Admitted central lifecycle operation identity used to resume a rejoin after restart."
                      required: [journalName, journalUID, requestName, requestUID, inventory, handoffApplied]
                      properties:
                        journalName: {type: string}
                        journalUID: {type: string}
                        requestName: {type: string}
                        requestUID: {type: string}
                        inventory:
                          type: object
                          required: [name, uid, digest]
                          properties:
                            name: {type: string}
                            uid: {type: string}
                            digest: {type: string}
                        handoffInventory:
                          type: object
                          required: [name, uid, digest]
                          properties:
                            name: {type: string}
                            uid: {type: string}
                            digest: {type: string}
                        completionDigest: {type: string}
                        handoffApplied: {type: boolean}
                    jobName: {type: string}
                    jobUID: {type: string}
                    jobPlanDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                    jobInputIdentityDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                    jobPhase: {type: string}
                    jobReason: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                completedAt: {type: string, format: date-time}
