apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubeovnrecoveryrequests.operator.kubeovn.io
spec:
  group: operator.kubeovn.io
  scope: Namespaced
  names:
    plural: kubeovnrecoveryrequests
    singular: kubeovnrecoveryrequest
    kind: KubeOVNRecoveryRequest
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [installationRef, reason, mode, approvedBy, expiresAt]
              properties:
                installationRef: {type: string}
                reason: {type: string}
                mode: {type: string, enum: [rejoin, reconvert, freshBootstrap]}
                targetMemberRef: {type: string}
                backupRef: {type: string}
                approvalRef:
                  type: object
                  required: [name, uid]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253}
                    uid: {type: string, minLength: 1, maxLength: 128}
                approvedBy: {type: string}
                expiresAt: {type: string, format: date-time}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, AwaitingExecution, Executing, Succeeded, Failed, Expired]
                plan:
                  type: object
                  required: [digest, installationUID, installationGeneration, requestGeneration, mode, expiresAt]
                  properties:
                    digest: {type: string}
                    installationUID: {type: string}
                    installationGeneration: {type: integer, format: int64}
                    requestGeneration: {type: integer, format: int64}
                    mode: {type: string, enum: [rejoin, reconvert, freshBootstrap]}
                    sourceVersion: {type: string}
                    targetVersion: {type: string}
                    chartDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                    targetMemberRef: {type: string}
                    targetMemberDigest: {type: string}
                    topologyDigest: {type: string}
                    backupRef: {type: string}
                    databaseRefs: {type: object, additionalProperties: {type: string}}
                    approvalRef:
                      type: object
                      required: [name, uid]
                      properties:
                        name: {type: string, minLength: 1, maxLength: 253}
                        uid: {type: string, minLength: 1, maxLength: 128}
                    expiresAt: {type: string, format: date-time}
                execution:
                  type: object
                  properties:
                    phase: {type: string, enum: [Blocked, Quiescing, Restoring, Workloads, Verifying, Succeeded, Failed]}
                    startedAt: {type: string, format: date-time}
                    completedAt: {type: string, format: date-time}
                    rpoSeconds: {type: integer, format: int64}
                    rtoSeconds: {type: integer, format: int64}
                    reason: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                completedAt: {type: string, format: date-time}
