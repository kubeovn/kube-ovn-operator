apiVersion: operator.kubeovn.io/v1alpha1
kind: KubeOVNInstallation
metadata:
  name: kube-ovn
  namespace: kube-ovn-operator-system
spec:
  version: v1.16.13
  chart:
    source: https://github.com/kubeovn/kube-ovn/releases/download/v1.16.13/kube-ovn-v1.16.13.tgz
    digest: sha256:24df922c7aa78e4a21e77289a6eec9a19ac50cb00953df9ada9291b61a638475
  mode: full
  central:
    mode: raft
    replicas: 3
    placement:
      topologyKey: kubernetes.io/hostname
    dynamicMembership: false
  dataPlane:
    ovsUpdateStrategy: RollingUpdate
  upgrade:
    strategy: gatedRolling
    pauseOnDegraded: true
    allowRollback: true
    backup:
      required: true
      destination: s3://example/kube-ovn
