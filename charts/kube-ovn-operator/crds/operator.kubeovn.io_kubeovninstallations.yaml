apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kubeovninstallations.operator.kubeovn.io
spec:
  group: operator.kubeovn.io
  scope: Namespaced
  names:
    plural: kubeovninstallations
    singular: kubeovninstallation
    kind: KubeOVNInstallation
    shortNames: [koi]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Version
          type: string
          jsonPath: .status.observedVersion
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [version, mode, central]
              properties:
                version: {type: string, minLength: 1}
                chart:
                  type: object
                  properties:
                    source: {type: string}
                    digest: {type: string}
                mode:
                  type: string
                  enum: [full, controlPlaneOnly, dataPlaneOnly]
                central:
                  type: object
                  required: [mode, replicas]
                  properties:
                    mode: {type: string, enum: [raft, single]}
                    replicas: {type: integer, format: int32, minimum: 1, maximum: 5}
                    placement:
                      type: object
                      properties:
                        nodeSelector: {type: object, additionalProperties: {type: string}}
                        topologyKey: {type: string}
                    storage:
                      type: object
                      properties:
                        className: {type: string}
                        size: {type: string}
                    dynamicMembership: {type: boolean}
                    memberRequests:
                      type: array
                      maxItems: 4
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string, minLength: 1}
                          replaceEndpoint: {type: string, minLength: 1}
                          retireEndpoint: {type: string, minLength: 1}
                          removalApprovalRef:
                            type: object
                            required: [name, uid]
                            properties:
                              name: {type: string, minLength: 1}
                              uid: {type: string, minLength: 1}
                          tlsSecretRef:
                            type: object
                            required: [name]
                            properties:
                              name: {type: string, minLength: 1, maxLength: 253}
                          nodeName: {type: string, minLength: 1}
                          claimName: {type: string, minLength: 1}
                          volumeName: {type: string, minLength: 1}
                          image: {type: string, minLength: 1}
                          northboundAddress: {type: string, minLength: 1}
                          southboundAddress: {type: string, minLength: 1}
                          northboundClientAddress: {type: string, minLength: 1}
                          southboundClientAddress: {type: string, minLength: 1}
                dataPlane:
                  type: object
                  properties:
                    nodeSelector: {type: object, additionalProperties: {type: string}}
                    ovsUpdateStrategy: {type: string, enum: [RollingUpdate, OnDelete]}
                    externalOvnCentral:
                      type: object
                      properties:
                        nbEndpoint: {type: string}
                        sbEndpoint: {type: string}
                        nbPort: {type: integer, format: int32}
                        sbPort: {type: integer, format: int32}
                hcp:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    role: {type: string, enum: [none, management, dataPlane]}
                    pairRef: {type: string}
                    centralNamespace: {type: string, minLength: 1}
                    nbEndpoint: {type: string, minLength: 1}
                    sbEndpoint: {type: string, minLength: 1}
                    tlsSecretRef:
                      type: object
                      required: [name]
                      properties: {name: {type: string, minLength: 1}}
                upgrade:
                  type: object
                  properties:
                    strategy: {type: string}
                    pauseOnDegraded: {type: boolean}
                    allowRollback: {type: boolean}
                    rollbackApprovalRef:
                      type: object
                      required: [name, uid]
                      properties:
                        name: {type: string, minLength: 1, maxLength: 253}
                        uid: {type: string, minLength: 1, maxLength: 128}
                    backup:
                      type: object
                      properties:
                        required: {type: boolean}
                        destination: {type: string}
                        schedule: {type: string}
                        retention:
                          type: object
                          properties:
                            keepLast: {type: integer, format: int32, minimum: 0}
                            maxAge: {type: string}
                adoption:
                  type: object
                  x-kubernetes-validations:
                    - rule: "!has(self.enabled) || !self.enabled || (has(self.selector) && size(self.selector) > 0)"
                      message: "selector must contain at least one label when adoption is enabled"
                  properties:
                    enabled: {type: boolean}
                    selector: {type: object, additionalProperties: {type: string}}
                networkProbe:
                  type: object
                  required: [image]
                  properties:
                    image: {type: string, minLength: 1, maxLength: 512}
            status:
              type: object
              properties:
                applyCheckpoint:
                  type: object
                  required: [specHash, manifestHash, version]
                  properties:
                    specHash: {type: string}
                    baseSpecHash: {type: string}
                    manifestHash: {type: string}
                    version: {type: string}
                observedVersion: {type: string}
                phase: {type: string}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  items: {type: object, x-kubernetes-preserve-unknown-fields: true}
                topology:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    inventory:
                      type: object
                      required: [name, uid, digest]
                      properties:
                        name: {type: string, minLength: 1}
                        uid: {type: string, minLength: 1}
                        digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                    operation:
                      type: object
                      required: [journalName, journalUID, requestName, requestUID, inventory, handoffApplied]
                      properties:
                        journalName: {type: string}
                        journalUID: {type: string}
                        requestName: {type: string}
                        requestUID: {type: string}
                        inventory:
                          type: object
                          required: [name, uid, digest]
                          properties:
                            name: {type: string, minLength: 1}
                            uid: {type: string, minLength: 1}
                            digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                        handoffInventory:
                          type: object
                          required: [name, uid, digest]
                          properties:
                            name: {type: string, minLength: 1}
                            uid: {type: string, minLength: 1}
                            digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                        completionDigest: {type: string}
                        handoffApplied: {type: boolean}
                upgrade:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    planID: {type: string}
                    step: {type: string}
                    canRollback: {type: boolean}
                    backupID: {type: string}
                    targetVersion: {type: string}
                    checkpointAuthorized: {type: boolean}
                    checkpoint:
                      type: object
                      properties:
                        id: {type: string}
                        databaseRefs: {type: object, additionalProperties: {type: string}}
                        sourceVersion: {type: string}
                        targetVersion: {type: string}
                        destination: {type: string}
                        topologyDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                        capturedAt: {type: string, format: date-time}
                        appliedAt: {type: string, format: date-time}
                        phase: {type: string, enum: [Capturing, Verified, Applying, Applied, Failed]}
                        reason: {type: string}
                    rollback:
                      type: object
                      properties:
                        phase: {type: string, enum: [Blocked, Quiescing, Restoring, Workloads, Verifying, Succeeded, Failed]}
                        sourceVersion: {type: string}
                        targetVersion: {type: string}
                        backupID: {type: string}
                        topologyDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                        chartDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                        approvalRef:
                          type: object
                          required: [name, uid]
                          properties:
                            name: {type: string, minLength: 1, maxLength: 253}
                            uid: {type: string, minLength: 1, maxLength: 128}
                        startedAt: {type: string, format: date-time}
                        completedAt: {type: string, format: date-time}
                        rpoSeconds: {type: integer, format: int64}
                        rtoSeconds: {type: integer, format: int64}
                        reason: {type: string}
                hcp: {type: object, x-kubernetes-preserve-unknown-fields: true}
                lastBackup: {type: object, x-kubernetes-preserve-unknown-fields: true}
                backupRetention:
                  type: object
                  properties:
                    lastAttempt: {type: string, format: date-time}
                    lastSuccess: {type: string, format: date-time}
                    scanned: {type: integer, format: int32}
                    protected: {type: integer, format: int32}
                    deleted: {type: integer, format: int32}
                    reason: {type: string}
                network: {type: object, x-kubernetes-preserve-unknown-fields: true}
