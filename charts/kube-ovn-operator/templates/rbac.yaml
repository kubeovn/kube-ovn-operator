apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-ovn-operator.fullname" . }}
rules:
  - apiGroups: [operator.kubeovn.io]
    resources: [kubeovninstallations, kubeovninstallations/status, kubeovninstallations/finalizers, kubeovnrecoveryrequests, kubeovnrecoveryrequests/status, kubeovnrecoveryrequests/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [operator.kubeovn.io]
    resources: [kubeovnmemberremovalapprovals]
    verbs: [get, list, watch]
  - apiGroups: [operator.kubeovn.io]
    resources: [kubeovnmemberremovalapprovals/status]
    verbs: [get, update, patch]
  - apiGroups: [operator.kubeovn.io]
    resources: [kubeovnrecoveryapprovals]
    verbs: [get, list, watch]
  - apiGroups: [operator.kubeovn.io]
    resources: [kubeovnrecoveryapprovals/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-ovn-operator.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-ovn-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-ovn-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
